name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build backend
        run: go build -o /tmp/backend ./server

      - name: Test backend
        run: go test ./...

  ai-service:
    name: AI Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests if any exist
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          excluded = {'.git', '.venv', '__pycache__'}
          test_files = []

          for path in root.rglob('*.py'):
              if any(part in excluded for part in path.parts):
                  continue
              if path.name.startswith('test_') or path.name.endswith('_test.py'):
                  test_files.append(str(path))

          if test_files:
              print(f"Found Python test files: {test_files}")
              subprocess.run(['uv', 'run', 'pytest'], check=True)
          else:
              print('No Python tests found; skipping pytest.')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
